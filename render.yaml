services:
  - type: web
    name: f1-predictor-backend
    env: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /health
    envVars:
      # Required secrets - generate on first deploy
      - key: SECRET_KEY
        generateValue: true
        sync: false
      
      # Database connection (set to your Neon/Supabase PostgreSQL URL)
      - key: DATABASE_URL
        sync: false
      
      # CORS - set to your GitHub Pages URL after deployment
      - key: FRONTEND_ORIGIN
        sync: false
      
      # Production settings
      - key: ENVIRONMENT
        value: production
      
      # Cache configuration - use in-memory fallback (no Redis on free tier)
      - key: REDIS_REQUIRED
        value: "false"
      
      - key: ENABLE_IN_MEMORY_FALLBACK
        value: "true"
      
      # Optional: live data update interval (seconds)
      - key: LIVE_UPDATE_INTERVAL
        value: "300"
      
      # Debug mode (should be false in production)
      - key: DEBUG
        value: "false"
