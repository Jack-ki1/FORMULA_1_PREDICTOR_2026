[project]
name = "f1-predictor-2026"
version = "1.0.0"
description = "F1 Race Prediction System for 2026 Season"
authors = [
    {name = "F1 Predictor Team"}
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "SQLAlchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "requests>=2.31.0",
    "requests-cache>=1.0.0",
    "fastf1>=3.3.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "prometheus_client>=0.19.0",
    "openai>=1.0.0",
    "weasyprint>=60.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    # root package.json `lint` shells out to `ruff check backend`, but ruff was
    # never installed or configured, so that half of lint could never run.
    "ruff>=0.6.0",
]
# NOTE (repo audit, see docs/DEEP_AUDIT.md, item M-4): the previous "advanced-ml" extra
# (pymc, lifelines, gpy) and "reports" extra (weasyprint, openpyxl,
# reportlab) have been removed/folded in. weasyprint and openpyxl moved
# into main dependencies above since PDF/Excel export is an advertised
# core feature, not optional, and shipping without them caused those
# exports to silently degrade to mislabeled HTML/CSV. pymc, lifelines,
# gpy, and reportlab were never imported anywhere in the codebase and
# were dropped rather than carried forward speculatively.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Deliberately a *correctness* ruleset, not a style opinion piece. Without this,
# `ruff check backend` used its broad default and reported 1000+ findings on
# this codebase (mostly blanket-except and import-order style), which made
# `npm run lint` useless noise rather than a signal. These catch real defects:
#   F   pyflakes — undefined names, unused imports, f-strings w/o placeholders
#   E9  syntax/runtime errors
# NOTE: import sorting ("I") is deliberately NOT enabled — the codebase has
# never followed an import order, so it would drown the real signal in ~220
# cosmetic findings.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts, fixtures, and star-imports.
"backend/app/tests/**" = ["F401", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

