[project]
name = "f1-predictor-2026"
version = "1.0.0"
description = "F1 Race Prediction System for 2026 Season"
authors = [
    {name = "F1 Predictor Team"}
]
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "requests>=2.31.0",
    "requests-cache>=1.0.0",
    "fastf1>=3.3.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "prometheus_client>=0.19.0",
    "openai>=1.0.0",
    "weasyprint>=60.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
# NOTE (repo audit, see AUDIT.md M-4): the previous "advanced-ml" extra
# (pymc, lifelines, gpy) and "reports" extra (weasyprint, openpyxl,
# reportlab) have been removed/folded in. weasyprint and openpyxl moved
# into main dependencies above since PDF/Excel export is an advertised
# core feature, not optional, and shipping without them caused those
# exports to silently degrade to mislabeled HTML/CSV. pymc, lifelines,
# gpy, and reportlab were never imported anywhere in the codebase and
# were dropped rather than carried forward speculatively.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
