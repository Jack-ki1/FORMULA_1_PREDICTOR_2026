<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}F1 Predictor 2026{% endblock %}</title>
<meta name="description" content="AI-powered Formula 1 predictions for the 2026 season — race, qualifying and practice forecasts built on a real prediction engine.">

<!-- Tailwind CDN for layout utilities (spacing/flex/grid) — palette & components come from styles.css -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

<!-- Set theme before paint to avoid a flash of the wrong theme -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('f1-theme');
      var theme = saved === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body class="bg-app" style="min-height:100vh; max-width: 100%; overflow-x: hidden;">

<header class="f1-nav">
  <div class="flex flex-wrap items-center justify-between gap-3 px-4 sm:px-8 py-3">
    <a href="/" class="flex items-center gap-2.5" title="Back to home">
      <span class="f1-nav-logo">F1</span>
      <span class="f1-display text-base font-bold" style="color:var(--text)">
        Predictor <span style="color:var(--red)">2026</span>
      </span>
    </a>

    <nav class="flex flex-wrap items-center gap-4" aria-label="Primary">
      <a href="/dashboard/" class="f1-nav-link {{ 'is-active' if request.blueprint == 'predictions' else '' }}">Dashboard</a>
      <a href="/standings" class="f1-nav-link {{ 'is-active' if request.blueprint == 'standings' else '' }}">Standings</a>
      <a href="/h2h" class="f1-nav-link {{ 'is-active' if request.blueprint == 'h2h' else '' }}">H2H Comparison</a>
      <a href="/constructors" class="f1-nav-link {{ 'is-active' if request.blueprint == 'constructors' else '' }}">Constructors</a>
      <a href="/analytics" class="f1-nav-link {{ 'is-active' if request.blueprint == 'analytics_settings' else '' }}">Analytics &amp; Settings</a>
    </nav>

    <div class="flex items-center gap-2">
      <button id="theme-toggle-btn" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg id="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <span class="fs-11" style="color:var(--muted)"><span id="nav-tick">0</span>s ago</span>
      <span class="f1-live-pill"><span class="f1-live-dot" style="background:#fff"></span>LIVE</span>
    </div>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="f1-footer px-4 sm:px-8 py-6 mt-8">
  <div class="flex flex-wrap items-center justify-between gap-2 fs-11">
    <span>&copy; 2026 F1 Predictor. Predictions are modelled estimates, not betting advice.</span>
    <span class="f1-mono">Season 2026 &middot; Model v1.0</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme_toggle.js') }}"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
