{% extends "base.html" %}
{% block title %}Constructors — F1 Predictor 2026{% endblock %}

{% block content %}
<div id="team-data" data-teams='{{ teams | tojson | safe }}'></div>

<section class="px-4 sm:px-8 py-6">
  <!-- Image Banner Row for CONSTRUCTORS TAB -->
  <div class="image-banner-row flex flex-wrap gap-6 mb-8">
    <!-- Team 1 Slot -->
    <div class="img-slot rounded-xl border-2 border-purple-500/30 flex flex-col items-center justify-center p-6 hover:border-purple-500 transition-all duration-300 transform hover:scale-105 hover:shadow-2xl" style="flex: 1; min-width: 280px; height: 340px; position: relative; background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(168,85,247,0.08));">
      <span id="team-1-badge" class="absolute top-3 left-3 bg-purple-600 text-white text-sm font-bold px-3 py-2 rounded-lg shadow-lg z-10">#1</span>
      <div class="w-full h-full flex items-center justify-center overflow-hidden rounded-xl">
        <img id="team-1-image" src="/static/img/car_parts.png" alt="Team #1 Photo" class="max-w-full max-h-full object-contain transition-all duration-300 hover:brightness-110">
      </div>
      <div class="absolute bottom-3 left-3 right-3 bg-black/80 backdrop-blur-md rounded-lg p-3 text-center z-10">
        <span id="team-1-label" class="text-white text-sm font-bold">Team #1</span>
      </div>
    </div>
    <!-- Team 2 Slot -->
    <div class="img-slot rounded-xl border-2 border-orange-500/30 flex flex-col items-center justify-center p-6 hover:border-orange-500 transition-all duration-300 transform hover:scale-105 hover:shadow-2xl" style="flex: 1; min-width: 280px; height: 340px; position: relative; background: linear-gradient(135deg, rgba(249,115,22,0.15), rgba(249,115,22,0.08));">
      <span id="team-2-badge" class="absolute top-3 left-3 bg-orange-600 text-white text-sm font-bold px-3 py-2 rounded-lg shadow-lg z-10">#2</span>
      <div class="w-full h-full flex items-center justify-center overflow-hidden rounded-xl">
        <img id="team-2-image" src="/static/img/pit_stop.jpg" alt="Team #2 Photo" class="max-w-full max-h-full object-contain transition-all duration-300 hover:brightness-110">
      </div>
      <div class="absolute bottom-3 left-3 right-3 bg-black/80 backdrop-blur-md rounded-lg p-3 text-center z-10">
        <span id="team-2-label" class="text-white text-sm font-bold">Team #2</span>
      </div>
    </div>
    <!-- Team 3 Slot -->
    <div class="img-slot rounded-xl border-2 border-cyan-500/30 flex flex-col items-center justify-center p-6 hover:border-cyan-500 transition-all duration-300 transform hover:scale-105 hover:shadow-2xl" style="flex: 1; min-width: 280px; height: 340px; position: relative; background: linear-gradient(135deg, rgba(6,182,212,0.15), rgba(6,182,212,0.08));">
      <span id="team-3-badge" class="absolute top-3 left-3 bg-cyan-600 text-white text-sm font-bold px-3 py-2 rounded-lg shadow-lg z-10">#3</span>
      <div class="w-full h-full flex items-center justify-center overflow-hidden rounded-xl">
        <img id="team-3-image" src="/static/img/circuit1.png" alt="Team #3 Photo" class="max-w-full max-h-full object-contain transition-all duration-300 hover:brightness-110">
      </div>
      <div class="absolute bottom-3 left-3 right-3 bg-black/80 backdrop-blur-md rounded-lg p-3 text-center z-10">
        <span id="team-3-label" class="text-white text-sm font-bold">Team #3</span>
      </div>
    </div>
  </div>

  <div class="fs-11 uppercase tracking-widest font-bold mb-4 text-sub">Constructors</div>

  <div class="card p-4 mb-6">
    <div class="f1-display font-bold mb-2">Power Rankings</div>
    <p class="text-xs mb-2 text-sub">Current constructor points, ordered by championship position.</p>
    <div class="chart-box tall"><canvas id="chart-power-rankings"></canvas></div>
  </div>

  <div id="team-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/constructors.js') }}"></script>
{% endblock %}
