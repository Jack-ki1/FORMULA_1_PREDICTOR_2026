name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: cd backend && ../.venv/bin/python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Assert the Node major is what the test suite supports (jsdom/AbortSignal realm issue)
        run: node -e 'const m=+process.versions.node.split(".")[0]; if (m!==22) { console.error(`frontend tests require Node 22, got ${process.version}`); process.exit(1); }'
      - run: python -m venv .venv && .venv/bin/python -m pip install -r backend/requirements.txt
      - run: cd backend && (DATA_MODE=seed ../.venv/bin/python -m uvicorn main:app --port 8000 &) && sleep 4
      - name: Wait for the API to answer /health
        run: for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done; echo 'API did not start'; exit 1
      - run: cd frontend && npm ci && npm run typecheck && npm test && npm run build
