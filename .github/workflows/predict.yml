name: On-Demand Race Prediction

on:
  workflow_dispatch:
    inputs:
      circuit:
        description: 'Circuit ID (canada, monaco, silverstone, ...)'
        required: true
        default: 'canada'
      rain_probability:
        description: 'Rain probability override [0.0-1.0] — leave blank for default'
        required: false
        default: ''
      simulations:
        description: 'Monte Carlo simulations (500=fast, 5000=standard, 20000=precise)'
        required: false
        default: '5000'
      scenario:
        description: 'Scenario tag for artifact naming'
        required: false
        default: 'standard'

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prediction
        env:
          CIRCUIT: ${{ github.event.inputs.circuit }}
          SIMS: ${{ github.event.inputs.simulations }}
          RAIN: ${{ github.event.inputs.rain_probability }}
        run: |
          RAIN_ARG=""
          if [ -n "$RAIN" ]; then
            RAIN_ARG="--rain $RAIN"
          fi
          mkdir -p output
          python main.py predict \
            --race "$CIRCUIT" \
            --sims "$SIMS" \
            $RAIN_ARG \
            --json-out > output/prediction_${CIRCUIT}.json

          python main.py report \
            --race "$CIRCUIT" \
            --sims "$SIMS" \
            $RAIN_ARG \
            --output output/${CIRCUIT}_report.html

      - name: Upload prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f1-prediction-${{ github.event.inputs.circuit }}-${{ github.event.inputs.scenario }}
          path: output/
          retention-days: 30

      - name: Summary
        run: |
          echo "## F1 Race Prediction Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Circuit:** ${{ github.event.inputs.circuit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Simulations:** ${{ github.event.inputs.simulations }}" >> $GITHUB_STEP_SUMMARY
          echo "**Scenario:** ${{ github.event.inputs.scenario }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the HTML report from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
