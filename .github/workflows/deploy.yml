name: Deploy F1 Predictions to GitHub Pages

on:
  # Auto-deploy every Thursday at 09:00 UTC (day before most practice sessions)
  schedule:
    - cron: "0 9 * * 4"

  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      race:
        description: 'Circuit ID to feature (e.g. canada, monaco)'
        required: false
        default: ''
      rain_probability:
        description: 'Rain probability override [0.0-1.0]'
        required: false
        default: ''
      simulations:
        description: 'Number of Monte Carlo simulations'
        required: false
        default: '5000'

  # Also trigger when season data files change
  push:
    branches: [ main ]
    paths:
      - 'data/season_2026.py'
      - 'data/driver_data.py'
      - 'data/circuit_data.py'
      - 'data/calendar_2026.py'
      - 'engine/**'
      - 'config/**'

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate predictions and static site
        env:
          SIMS: ${{ github.event.inputs.simulations || '5000' }}
          RAIN: ${{ github.event.inputs.rain_probability || '' }}
        run: |
          RAIN_ARG=""
          if [ -n "$RAIN" ]; then
            RAIN_ARG="--rain $RAIN"
          fi
          python scripts/generate_static_site.py --sims $SIMS $RAIN_ARG

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
