server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /dashboard/ { proxy_pass http://backend:5000; }
  location /health { proxy_pass http://backend:5000; }
  location /standings/ { proxy_pass http://backend:5000; }
  location /h2h/ { proxy_pass http://backend:5000; }
  location /constructors/ { proxy_pass http://backend:5000; }
  location /analytics/ { proxy_pass http://backend:5000; }
  location /reports/ { proxy_pass http://backend:5000; }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
