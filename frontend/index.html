<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Predictor 2026</title>
    <meta name="description" content="AI-powered Formula 1 predictions for the 2026 season — race, qualifying and practice forecasts built on a real prediction engine.">
    <script src="https://js.puter.com/v2/"></script>
    <script>
      (function(){try{var s=localStorage.getItem('f1-theme');var t=s==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>
    <script>
      // One-time cleanup: an earlier build registered a PWA service worker that's since
      // been removed. Unregister any leftover worker and clear its caches so browsers that
      // already installed it stop serving a stale app shell / stale cached API responses.
      // Safe to delete this block a few weeks after deploying this fix, once you're
      // confident no returning visitor still has the old worker installed.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister())
        })
      }
      if ('caches' in window) {
        caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)))
      }
    </script>
  </head>
  <body class="bg-app">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
