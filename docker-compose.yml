services:
  # Decoupled: frontend runs via `npm run dev` on 5173 or Vercel static host.
  # Backend is pure API on 5000. For production use managed Redis/Postgres.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./f1_predictions.db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_REQUIRED=${REDIS_REQUIRED:-false}
      - ENABLE_IN_MEMORY_FALLBACK=${ENABLE_IN_MEMORY_FALLBACK:-true}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
      - SECRET_KEY=${SECRET_KEY:-change-me}
    depends_on:
      - redis
    volumes:
      - ./cache:/app/cache
      - f1_db:/app/data
    networks:
      - f1net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - f1net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s

networks:
  f1net:
    driver: bridge

volumes:
  redis_data:
  f1_db:
